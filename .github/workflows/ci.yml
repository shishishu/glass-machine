name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=glassmachine --cov-report=term-missing --cov-fail-under=75
      - run: glassmachine verify
      - run: glassmachine replay experiments/m0-not.json

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install -y libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[gui]"
      - run: QT_QPA_PLATFORM=offscreen glassmachine gui --smoke
