[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glassmachine"
version = "0.1.0.dev0"
description = "Grounded, Layered, Auditable Systems Simulator — From Bit to Attention"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "shishishu" }]
keywords = ["computer-architecture", "simulation", "digital-logic", "education"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
glassmachine = "glassmachine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glassmachine"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/glassmachine"]
exclude = ["src/glassmachine/visualization/not_demo.py"]
